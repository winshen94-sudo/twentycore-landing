  <title>TwentyCore — Redirecting…</title>

       static file before the redirect rule. -->

  <link rel="canonical" href="https://www.twentycore.ai/early-access" />
  <meta name="robots" content="noindex" />
  <script>window.location.replace("https://www.twentycore.ai/early-access");</script>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0b1220; color:#e2e8f0; display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    a { color:#60a5fa; }
  </style>
</head>
<body>
